<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="בדיקת בריאות לחיסכון הפנסיוני שלך" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
  <title>Pension Control</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" data-go="home" aria-label="דף הבית">
        <span class="brand-mark">PC</span>
        <span>Pension Control</span>
      </button>
      <nav class="top-actions">
        <button class="ghost hidden" id="resetBtn">איפוס נתונים</button>
      </nav>
    </header>

    <main id="app" tabindex="-1"></main>

    <footer>
      <p>גרסת MVP להמחשה בלבד. המידע במערכת אינו ייעוץ פנסיוני, שיווק פנסיוני או ייעוץ השקעות.</p>
    </footer>
  </div>

  <template id="homeTpl">
    <section class="home-blue-wrap">
      <div class="home-blue-hero section">
        <div class="home-blue-copy">
          <span class="home-chip">פשוט · ברור · אישי</span>
          <h1>בדיקה מהירה לחיסכון הפנסיוני שלך</h1>
          <p class="home-blue-lead">קבל תמונת מצב ברורה של החיסכון, דמי הניהול והנקודות שכדאי לבדוק — בתוך כמה דקות ובשפה פשוטה.</p>

          <div class="home-check-cards" id="checkTypes">
            <article class="home-check-card home-check-fast">
              <span class="home-card-icon">⚡</span>
              <div>
                <span class="home-card-kicker">ללא פרטים אישיים</span>
                <h3>בדיקה מהירה</h3>
                <p>הזינו את הנתונים וקבלו Pension Score ותובנות ראשוניות מיד.</p>
              </div>
              <button class="home-card-button" data-start-mode="anonymous" aria-label="התחל בדיקה מהירה">←</button>
            </article>

            <article class="home-check-card home-check-real">
              <span class="home-card-icon">✓</span>
              <div>
                <span class="home-card-kicker">חינם</span>
                <h3>בדיקת התיק הביטוחי</h3>
                <p>בדיקה מקיפה של התיק הביטוחי וקבלת תמונת מצב מסודרת.</p>
              </div>
              <button class="home-card-button" data-start-mode="real" aria-label="התחל בדיקת התיק הביטוחי">←</button>
            </article>

            <article class="home-check-card home-check-paid" data-open-paid>
              <span class="home-card-icon">₪</span>
              <div>
                <span class="home-card-kicker">בדיקה מקצועית</span>
                <h3>בדיקה פנסיונית מלאה</h3>
                <p>קבלת תמונת מצב פנסיונית ותובנות ממוקדות.</p>
              </div>
              <button class="home-card-button" type="button" data-open-paid aria-label="התחל בדיקה פנסיונית מלאה">←</button>
            </article>
          </div>

          <div class="home-blue-benefits">
            <span><b>🔒</b> מידע מאובטח</span>
            <span><b>◷</b> תוצאה מהירה</span>
            <span><b>↗</b> תובנות ברורות</span>
          </div>
        </div>

        <div class="home-dashboard-preview" aria-label="המחשה של מסך התוצאות">
          <div class="preview-floating-badge preview-top-badge"><strong>82/100</strong><small>Pension Score</small></div>
          <div class="preview-dashboard-card">
            <div class="preview-dashboard-head"><div><span>התמונה הפנסיונית שלך</span><strong>₪1,250,000</strong></div><span class="preview-pill">נראה טוב</span></div>
            <div class="preview-main-grid">
              <div class="preview-donut-wrap">
                <div class="preview-donut"><div><strong>₪1.25M</strong><small>סה״כ חיסכון</small></div></div>
              </div>
              <div class="preview-legend">
                <div><i></i><span>קרן פנסיה</span><strong>52%</strong></div>
                <div><i></i><span>קרן השתלמות</span><strong>24%</strong></div>
                <div><i></i><span>קופות נוספות</span><strong>24%</strong></div>
              </div>
            </div>
            <div class="preview-mini-stats">
              <div><small>דמי ניהול</small><strong>0.58%</strong></div>
              <div><small>נקודות לבדיקה</small><strong>3</strong></div>
              <div><small>הפקדה שנתית</small><strong>₪24,000</strong></div>
            </div>
            <div class="preview-reco">
              <div><span>💡</span><strong>המלצות לשיפור</strong></div>
              <p>בדיקת דמי ניהול · התאמת מסלול · איתור קופות לא פעילות</p>
            </div>
          </div>
          <div class="preview-floating-badge preview-side-badge"><strong>יותר סדר</strong><small>פחות סימני שאלה</small></div>
        </div>
      </div>

      <div class="home-blue-bottom section">
        <div><strong>תמונה אחת ברורה</strong><span>כל הנתונים החשובים במקום אחד</span></div>
        <div><strong>נקודות לשיפור</strong><span>מה כדאי לבדוק ובאיזה סדר</span></div>
        <div><strong>בלי התחייבות</strong><span>אפשר להתחיל בבדיקה מהירה</span></div>
      </div>

      <section class="home-lead-section section">
        <div class="home-lead-copy"><span class="home-chip">מעדיפים לדבר איתנו?</span><h2>השאירו פרטים ונחזור אליכם</h2><p>לא בטוחים איזו בדיקה מתאימה? השאירו שם וטלפון וניצור קשר.</p><a href="tel:048220228">04-8220228</a></div>
        <form class="home-lead-form" id="homeLeadForm">
          <label>שם מלא<input name="fullName" required autocomplete="name" placeholder="שם מלא"></label>
          <label>טלפון<input name="phone" required inputmode="tel" autocomplete="tel" placeholder="05X-XXXXXXX"></label>
          <label>אימייל <span>(אופציונלי)</span><input name="email" type="email" autocomplete="email" placeholder="name@example.com"></label>
          <button class="primary" type="submit">חזרו אליי</button><p class="lead-status" id="homeLeadStatus"></p>
        </form>
      </section>

      <div class="pc-modal hidden" id="paidCheckModal" aria-hidden="true">
        <div class="pc-modal-backdrop" data-close-paid></div>
        <div class="pc-modal-card" role="dialog" aria-modal="true" aria-labelledby="paidCheckTitle">
          <button class="pc-modal-close" type="button" data-close-paid aria-label="סגירה">×</button>
          <span class="home-chip">בדיקה פנסיונית · 49 ₪</span>
          <h2 id="paidCheckTitle">מתחילים בבדיקה הפנסיונית</h2>
          <p>השאירו פרטים ולאחר מכן תעברו לעמוד התשלום המאובטח.</p>
          <form id="paidCheckForm" class="paid-check-form">
            <label>שם מלא<input name="fullName" required autocomplete="name" placeholder="שם מלא"></label>
            <label>טלפון<input name="phone" required inputmode="tel" autocomplete="tel" placeholder="05X-XXXXXXX"></label>
            <label>אימייל<input name="email" type="email" autocomplete="email" placeholder="name@example.com"></label>
            <label class="checkbox"><input type="checkbox" required name="consent"> אני מאשר/ת שניתן ליצור איתי קשר לצורך הבדיקה</label>
            <button class="primary paid-submit" type="submit">המשך לתשלום 49 ₪</button>
            <p class="lead-status" id="paidLeadStatus"></p>
          </form>
          <small class="payment-note">התשלום מתבצע בעמוד המאובטח של PayMe.</small>
        </div>
      </div>
    </section>
  </template>

  <template id="onboardingTpl">
    <section class="section narrow">
      <div class="stepper"><span class="active">1</span><i></i><span>2</span><i></i><span>3</span><i></i><span>4</span></div>
      <div class="panel">
        <span class="eyebrow" id="onboardingStepLabel">שלב 1</span>
        <div class="mode-pill" id="onboardingModePill"></div>
        <h2>קצת עליך</h2>
        <p class="muted">המידע עוזר לנו להציג את הנתונים בהקשר הנכון. אפשר לשנות אותו בכל רגע.</p>
        <form id="profileForm" class="form-grid">
          <label>גיל<input required name="age" inputmode="numeric" type="number" min="18" max="80" placeholder="27" /></label>
          <label>שכר חודשי ברוטו<input required name="salary" inputmode="decimal" type="number" min="0" step="100" placeholder="17000" /></label>
          <label>מצב משפחתי<select name="family"><option value="single">רווק/ה</option><option value="married">נשוי/אה</option><option value="children">משפחה עם ילדים</option></select></label>
          <label>סגנון השקעה<select name="risk"><option value="low">שמרני</option><option value="medium" selected>מאוזן</option><option value="high">מוכן/ה לתנודתיות גבוהה</option></select></label>
          <label class="wide">המטרה המרכזית<select name="goal"><option value="retirement">להגדיל חיסכון לפרישה</option><option value="fees">להוזיל דמי ניהול</option><option value="order">לעשות סדר בכל הקופות</option><option value="understand">להבין מה יש לי</option></select></label>
          <div class="wide action-line"><button class="primary" id="profileContinue" type="submit">המשך</button></div>
        </form>
      </div>
    </section>
  </template>

  <template id="verificationTpl">
    <section class="section narrow">
      <div class="stepper"><span class="done">✓</span><i class="done"></i><span class="active">2</span><i></i><span>3</span><i></i><span>4</span></div>
      <div class="panel">
        <span class="eyebrow">בדיקת אמת · שלב 2 מתוך 4</span>
        <div class="mode-pill real-pill">בדיקת אמת</div>
        <h2>הרשאה וזיהוי</h2>
        <p class="muted">הפרטים נועדו לאפשר בהמשך קבלת מידע פנסיוני מדויק בכפוף להסכמתך. בגרסת ה-MVP אין חיבור למסלקה או לגוף חיצוני והמידע אינו נשלח מהדפדפן.</p>
        <div class="privacy-alert"><strong>חשוב:</strong> זהו עדיין MVP. לפני שימוש מסחרי בפרטים מזהים אמיתיים נחבר backend מאובטח, הצפנה, הרשאות ובקרת גישה. בשלב זה מומלץ להשתמש בנתוני בדיקה בלבד.</div>
        <form id="verificationForm" class="form-grid">
          <label>שם מלא<input required name="fullName" autocomplete="name" placeholder="ישראל ישראלי" /></label>
          <label>מספר תעודת זהות<input required name="idNumber" inputmode="numeric" maxlength="9" pattern="[0-9]{5,9}" placeholder="123456789" /></label>
          <label>תאריך הנפקת תעודת זהות<input required name="idIssueDate" type="date" /></label>
          <label>טלפון נייד<input name="phone" inputmode="tel" autocomplete="tel" placeholder="05X-XXXXXXX" /></label>
          <label class="wide">דוא״ל<input name="email" type="email" autocomplete="email" placeholder="name@example.com" /></label>

          <div class="wide signature-wrap">
            <div class="signature-title"><div><strong>חתימה</strong><p>חתום/י עם העכבר או האצבע בתוך המסגרת.</p></div><button type="button" class="ghost" id="clearSignature">נקה חתימה</button></div>
            <canvas id="signaturePad" width="900" height="260" aria-label="משטח חתימה"></canvas>
            <input type="hidden" name="signatureProvided" />
          </div>

          <div class="wide consent-box">
            <label class="checkbox"><input required type="checkbox" name="consentAccess" /> אני מאשר/ת להשתמש בפרטים שמסרתי לצורך קבלת, ריכוז והצגת המידע הפנסיוני והביטוחי שלי, בכפוף לדין ולהרשאות הנדרשות.</label>
            <label class="checkbox"><input required type="checkbox" name="consentPrivacy" /> קראתי והבנתי כי המידע האישי והפיננסי הוא מידע רגיש וכי בגרסה מסחרית יוצגו מדיניות פרטיות, אבטחת מידע, מטרות השימוש ותקופת השמירה.</label>
            <label class="checkbox"><input required type="checkbox" name="consentDisclaimer" /> ידוע לי שהמערכת מספקת תמונת מצב וכלי עזר בלבד ואינה מהווה ייעוץ פנסיוני, שיווק פנסיוני או ייעוץ השקעות.</label>
          </div>
          <div class="wide disclosure">
            <strong>גילוי נאות מקוצר</strong>
            <p>ההרשאה מיועדת לצורך איסוף והצגת מידע שהמשתמש ביקש לקבל. אין בעצם הצגת הנתונים המלצה לבצע ניוד, שינוי מסלול, ביטול מוצר, רכישת ביטוח או השקעה. לפני הפעלה מסחרית יש להתאים את נוסח ההסכמה, הפרטיות וההרשאה למסגרת המשפטית והרגולטורית החלה בפועל.</p>
          </div>
          <div class="wide action-line"><button type="button" class="ghost" data-go="onboarding">חזרה</button><button class="primary" type="submit">אישור והמשך</button></div>
        </form>
      </div>
    </section>
  </template>

  <template id="dataTpl">
    <section class="section narrow">
      <div class="stepper"><span class="done">✓</span><i class="done"></i><span class="done">✓</span><i class="done"></i><span class="active">3</span><i></i><span>4</span></div>
      <div class="panel">
        <span class="eyebrow" id="dataStepLabel">שלב הנתונים</span>
        <div class="mode-pill" id="dataModePill"></div>
        <h2>החיסכון שלך</h2>
        <p class="muted" id="dataIntro">מזינים את הנתונים המרכזיים ומקבלים תמונת מצב.</p>
        <div class="upload-box" id="uploadBox">
          <div class="report-upload-head"><div><strong>ניתוח אוטומטי של דוח הר הביטוח</strong><p>העלה קובץ Excel שהופק מהר הביטוח. הקובץ נקרא מקומית בדפדפן ואינו נשלח לשרת בשלב זה.</p></div><span class="local-badge">עיבוד מקומי</span></div>
          <input id="reportFile" type="file" accept=".xlsx,.xls,.csv" hidden />
          <button type="button" class="secondary" id="pickFile">בחר דוח הר הביטוח</button>
          <p id="fileName">Excel — עד 10MB</p>
          <div id="reportParseStatus" class="report-parse-status hidden"></div>
          <div id="insurancePreview" class="insurance-preview hidden"></div>
        </div>
        <div class="manual-divider"><span>או</span></div><h3 class="manual-title">הזנה ידנית של נתונים פנסיוניים</h3><form id="pensionForm" class="form-grid">
          <div class="wide product-title"><h3>קרן פנסיה</h3><span>מוצר מרכזי</span></div>
          <label>יתרה<input required name="pensionBalance" type="number" min="0" step="100" placeholder="312000" /></label>
          <label>הפקדה חודשית<input required name="pensionDeposit" type="number" min="0" step="10" placeholder="3150" /></label>
          <label>דמי ניהול מצבירה (%)<input required name="pensionAssetFee" type="number" min="0" max="2" step="0.01" placeholder="0.18" /></label>
          <label>דמי ניהול מהפקדה (%)<input required name="pensionDepositFee" type="number" min="0" max="8" step="0.01" placeholder="1.10" /></label>
          <label class="wide">מסלול<select name="pensionTrack"><option value="general">כללי / תלוי גיל</option><option value="stocks">מניות</option><option value="sp500">S&P 500</option><option value="bonds">אג"ח / סולידי</option></select></label>

          <div class="wide divider"></div>
          <div class="wide product-title"><h3>קרן השתלמות</h3><span>אופציונלי</span></div>
          <label>יתרה<input name="studyBalance" type="number" min="0" step="100" placeholder="121000" /></label>
          <label>דמי ניהול מצבירה (%)<input name="studyFee" type="number" min="0" max="2" step="0.01" placeholder="0.65" /></label>
          <label class="wide">מסלול<select name="studyTrack"><option value="none">אין / לא יודע</option><option value="general">כללי</option><option value="stocks">מניות</option><option value="sp500">S&P 500</option><option value="bonds">אג"ח / סולידי</option></select></label>

          <div class="wide divider"></div>
          <div class="wide product-title"><h3>קופות נוספות</h3><span>גמל / קופה לא פעילה</span></div>
          <label>יתרה נוספת<input name="otherBalance" type="number" min="0" step="100" placeholder="50500" /></label>
          <label>האם הקופה פעילה?<select name="otherActive"><option value="yes">כן</option><option value="no">לא</option><option value="unknown">לא יודע/ת</option></select></label>
          <label class="wide checkbox"><input type="checkbox" name="depositsOk" checked /> ההפקדות החודשיות האחרונות נראות לי תקינות</label>
          <div class="wide action-line"><button type="button" class="ghost" data-go="verification">חזרה</button><button class="primary" type="submit">נתח את החיסכון שלי</button></div>
        </form>
      </div>
    </section>
  </template>

  <template id="dashboardTpl">
    <section class="section dashboard" id="dashboardContent"></section>
  </template>
</body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="backend.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="app.js"></script>
</html>
